<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1308.75px" preserveAspectRatio="none" style="width:695px;height:1308px;background:#FFFFFF;" version="1.1" viewBox="0 0 695 1308" width="695.625px" zoomAndPan="magnify"><title>&lt;size:12&gt;&lt;color:#087F8C&gt;05 / RESPONSIBILITIES&lt;/color&gt;&lt;/size&gt;</title><defs/><g><text fill="#087F8C" font-family="Helvetica" font-size="22.5" font-weight="bold" lengthAdjust="spacing" textLength="252.5647" x="214.3877" y="54.8254">05 / RESPONSIBILITIES</text><text fill="#142D4E" font-family="Helvetica" font-size="43.125" font-weight="bold" lengthAdjust="spacing" textLength="606.34" x="37.5" y="93.2071">Give each decision one home</text><!--entity S--><g class="entity" data-entity="S" data-source-line="5" data-uid="ent0002" id="entity_S"><rect fill="#EAF3F9" height="153.75" rx="11.25" ry="11.25" width="534.6185" x="85.5494" y="155.625"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="240.7104" x="123.0494" y="213.338">Application service</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="310.8472" x="123.0494" y="239.588">Load portfolio &#183; fetch quote</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="459.6185" x="123.0494" y="265.838">Delegate sale &#183; persist state and history</text></g><!--entity P--><g class="entity" data-entity="P" data-source-line="6" data-uid="ent0003" id="entity_P"><rect fill="#E6F3F1" height="206.25" rx="11.25" ry="11.25" width="479.2346" x="113.2432" y="375"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="107.8967" x="150.7432" y="432.713">Portfolio</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="297.594" x="150.7432" y="458.963">sell(ticker, quantity, price)</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="7.2931" x="150.7432" y="485.213">&#160;</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="404.2346" x="150.7432" y="511.463">Validate the command and holding</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="382.2913" x="150.7432" y="537.713">Credit cash by the sale proceeds</text></g><!--entity H--><g class="entity" data-entity="H" data-source-line="7" data-uid="ent0004" id="entity_H"><rect fill="#E6F3F1" height="206.25" rx="11.25" ry="11.25" width="398.8568" x="153.4244" y="646.875"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="97.6813" x="190.9244" y="704.588">Holding</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="220.2924" x="190.9244" y="730.838">sell(quantity, price)</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="7.2931" x="190.9244" y="757.088">&#160;</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="271.3953" x="190.9244" y="783.338">Check available shares</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="323.8568" x="190.9244" y="809.588">Consume lots in FIFO order</text></g><!--entity L--><g class="entity" data-entity="L" data-source-line="8" data-uid="ent0005" id="entity_L"><rect fill="#E6F3F1" height="206.25" rx="11.25" ry="11.25" width="533.1061" x="86.2994" y="918.75"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="40.8105" x="123.7994" y="976.463">Lot</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="458.1061" x="123.7994" y="1002.713">calculateCostBasis(take) &#183; reduce(take)</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="7.2931" x="123.7994" y="1028.963">&#160;</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="280.1495" x="123.7994" y="1055.213">Calculate purchase cost</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="421.6919" x="123.7994" y="1081.463">Check and reduce remaining shares</text></g><g class="entity" data-entity="GMN9" data-source-line="13" data-uid="ent0010" id="entity_GMN9"><path d="M31.9057,1201.875 L31.9057,1284.375 A11.25,11.25 0 0 0 43.1557,1295.625 L662.5594,1295.625 A11.25,11.25 0 0 0 673.8094,1284.375 L673.8094,1209.375 L655.0594,1190.625 L360.3494,1190.625 L352.8494,1125.375 L345.3494,1190.625 L43.1557,1190.625 A11.25,11.25 0 0 0 31.9057,1201.875" fill="#F3F7FA" style="stroke:#DCE5ED;stroke-width:0.9375;"/><path d="M655.0594,1190.625 L655.0594,1203.75 A5.625,5.625 0 0 0 660.6844,1209.375 L673.8094,1209.375 L655.0594,1190.625" fill="#F3F7FA" style="stroke:#DCE5ED;stroke-width:0.9375;"/><text fill="#41576B" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="500.0089" x="61.9057" y="1237.5192">Portfolio, Holding and Lot form one aggregate.</text><text fill="#41576B" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="565.0287" x="61.9057" y="1261.8942">Application mutations should enter through Portfolio.</text></g><!--link S to P--><g class="link" data-entity-1="S" data-entity-2="P" data-source-line="9" data-uid="lnk6" id="link_S_P"><path d="M352.8494,310.2188 C352.8494,330.7313 352.8494,341.9625 352.8494,363.6" fill="none" id="S-to-P" style="stroke:#52718D;stroke-width:2.625;"/><polygon fill="#52718D" points="352.8494,374.85,360.3494,357.975,352.8494,365.475,345.3494,357.975,352.8494,374.85