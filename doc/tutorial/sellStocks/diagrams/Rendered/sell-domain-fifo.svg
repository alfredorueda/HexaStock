<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1276.875px" preserveAspectRatio="none" style="width:601px;height:1276px;background:#FFFFFF;" version="1.1" viewBox="0 0 601 1276" width="601.875px" zoomAndPan="magnify"><title>&lt;size:12&gt;&lt;color:#087F8C&gt;03 / DOMAIN&lt;/color&gt;&lt;/size&gt;</title><defs/><g><text fill="#087F8C" font-family="Helvetica" font-size="22.5" font-weight="bold" lengthAdjust="spacing" textLength="135.022" x="226.4017" y="54.8254">03 / DOMAIN</text><text fill="#142D4E" font-family="Helvetica" font-size="43.125" font-weight="bold" lengthAdjust="spacing" textLength="512.8253" x="37.5" y="93.2071">One sale, two FIFO steps</text><!--entity Start--><g class="entity" data-entity="Start" data-source-line="5" data-uid="ent0002" id="entity_Start"><rect fill="#EAF3F9" height="153.75" rx="11.25" ry="11.25" width="535.7208" x="40.1147" y="155.625"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="230.5078" x="77.6147" y="213.338">START &#183; 15 shares</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="460.7208" x="77.6147" y="239.588">Lot 1: 10 &#215; 100.00   |   Lot 2: 5 &#215; 120.00</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="197.0288" x="77.6147" y="265.838">Sell 12 at 150.00</text></g><!--entity Check--><g class="entity" data-entity="Check" data-source-line="6" data-uid="ent0003" id="entity_Check"><rect fill="#F2F7FC" height="153.75" rx="11.25" ry="11.25" width="516.969" x="49.4897" y="375"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="249.5032" x="86.9897" y="432.713">1  Check availability</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="441.969" x="86.9897" y="458.963">15 &#8805; 12 &#183; proceed before mutating lots</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="405.0165" x="86.9897" y="485.213">Proceeds = 12 &#215; 150.00 = 1800.00</text></g><!--entity First--><g class="entity" data-entity="First" data-source-line="7" data-uid="ent0004" id="entity_First"><rect fill="#E6F3F1" height="180" rx="11.25" ry="11.25" width="479.9011" x="68.0335" y="594.375"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="218.7799" x="105.5335" y="652.088">2  Consume Lot 1</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="257.5269" x="105.5335" y="678.338">Take min(10, 12) = 10</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="404.9011" x="105.5335" y="704.588">Cost basis +1000.00 &#183; still to sell: 2</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="350.1068" x="105.5335" y="730.838">Lot empty &#8594; iterator.remove()</text></g><!--entity Second--><g class="entity" data-entity="Second" data-source-line="8" data-uid="ent0005" id="entity_Second"><rect fill="#E6F3F1" height="180" rx="11.25" ry="11.25" width="465.3021" x="75.3272" y="840"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="218.7799" x="112.8272" y="897.713">3  Consume Lot 2</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="213.7299" x="112.8272" y="923.963">Take min(5, 2) = 2</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="390.3021" x="112.8272" y="950.213">Cost basis +240.00 &#183; still to sell: 0</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="288.9294" x="112.8272" y="976.463">Keep Lot 2 with 3 shares</text></g><!--entity Result--><g class="entity" data-entity="Result" data-source-line="9" data-uid="ent0006" id="entity_Result"><rect fill="#FFF5DF" height="180" rx="11.25" ry="11.25" width="528.8507" x="43.546" y="1085.625"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" font-weight="bold" lengthAdjust="spacing" textLength="291.698" x="81.046" y="1143.338">RESULT &#183; US-07.FIFO-2</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="453.8507" x="81.046" y="1169.588">Proceeds 1800.00 &#183; cost basis 1240.00</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="393.9679" x="81.046" y="1195.838">Profit 560.00 &#183; shares remaining 3</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="380.8429" x="81.046" y="1222.088">Portfolio credits cash by 1800.00</text></g><!--link Start to Check--><g class="link" data-entity-1="Start" data-entity-2="Check" data-source-line="10" data-uid="lnk7" id="link_Start_Check"><path d="M307.9772,309.8438 C307.9772,330.8063 307.9772,342.2625 307.9772,363.2438" fill="none" id="Start-to-Check" style="stroke:#52718D;stroke-width:2.625;"/><polygon fill="#52718D" points="307.9772,374.4938,315.4772,357.6188,307.9772,365.1188,300.4772,357.6188,307.9772,374.4938" style="stroke:#52718D;stroke-width:2.625;"/></g><!--link Check to First--><g class="link" data-entity-1="Check" data-entity-2="First" data-source-line="11" data-uid="lnk8" id="link_Check_First"><path d="M307.9772,529.2938 C307.9772,549.9 307.9772,561.0938 307.9772,582.3562" fill="none" id="Check-to-First" style="stroke:#52718D;stroke-width:2.625;"/><polygon fill="#52718D" points="307.9772,593.6062,315.4772,576.7312,307.9772,584.2312,300.4772,576.7312,307.9772,593.6062" style="stroke:#52718D;stroke-width:2.625;"/></g><!--link First to Second--><g class="l