<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="1685.625px" preserveAspectRatio="none" style="width:1811px;height:1685px;background:#FFFFFF;" version="1.1" viewBox="0 0 1811 1685" width="1811.25px" zoomAndPan="magnify"><title>Two ways to maintain a projection</title><defs/><g><text fill="#142D4E" font-family="Helvetica" font-size="43.125" font-weight="bold" lengthAdjust="spacing" textLength="702.0868" x="552.6091" y="89.4571">Two ways to maintain a projection</text><ellipse cx="703.0486" cy="157.5" fill="#222222" rx="18.75" ry="18.75" style="stroke:#222222;stroke-width:1.875;"/><rect fill="#F1F1F1" height="101.25" rx="11.25" ry="11.25" style="stroke:#181818;stroke-width:0.9375;" width="358.0975" x="523.9998" y="213.75"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="283.0975" x="561.4998" y="271.463">Apply portfolio operation</text><polygon fill="#F1F1F1" points="524.5107,352.5,881.5865,352.5,904.0865,384.375,881.5865,416.25,524.5107,416.25,502.0107,384.375,524.5107,352.5" style="stroke:#181818;stroke-width:0.9375;"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="319.5758" x="543.2607" y="391.463">Projection update strategy?</text><text fill="#24374B" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="142.2748" x="340.9859" y="360.0192">Synchronous</text><text fill="#24374B" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="154.4623" x="922.8365" y="360.0192">Asynchronous</text><rect fill="#E4F3EF" height="127.5" rx="11.25" ry="11.25" style="stroke:#181818;stroke-width:0.9375;" width="328.8226" x="72.4393" y="435"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="253.8226" x="109.9393" y="492.713">Write portfolio, history</text><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="164.9084" x="109.9393" y="518.963">and projection</text><path d="M490.5762,600 L490.5762,645 L453.0762,652.5 L490.5762,660 L490.5762,705 A0,0 0 0 0 490.5762,705 L898.0252,705 A0,0 0 0 0 898.0252,705 L898.0252,618.75 L879.2752,600 L490.5762,600 A0,0 0 0 0 490.5762,600" fill="#F3F7FA" style="stroke:#DCE5ED;stroke-width:0.9375;"/><path d="M879.2752,600 L879.2752,618.75 L898.0252,618.75 L879.2752,600" fill="#F3F7FA" style="stroke:#DCE5ED;stroke-width:0.9375;"/><text fill="#41576B" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="330.574" x="520.5762" y="646.8942">All participating writes precede</text><text fill="#41576B" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="192.3459" x="520.5762" y="671.2692">the same commit.</text><rect fill="#F1F1F1" height="101.25" rx="11.25" ry="11.25" style="stroke:#181818;stroke-width:0.9375;" width="432.4512" x="20.625" y="601.875"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="357.4512" x="58.125" y="659.588">Commit the shared transaction</text><rect fill="#E4F3EF" height="127.5" rx="11.25" ry="11.25" style="stroke:#181818;stroke-width:0.9375;" width="328.8226" x="1004.8352" y="435"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="253.8226" x="1042.3352" y="492.713">Write portfolio, history</text><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="201.4124" x="1042.3352" y="518.963">and outbox event</text><rect fill="#F1F1F1" height="101.25" rx="11.25" ry="11.25" style="stroke:#181818;stroke-width:0.9375;" width="467.4426" x="935.5252" y="600"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="392.4426" x="973.0252" y="657.713">Commit the command transaction</text><rect fill="#FFF3D9" height="101.25" rx="11.25" ry="11.25" style="stroke:#181818;stroke-width:0.9375;" width="365.3137" x="986.5897" y="742.5"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="290.3137" x="1024.0897" y="800.213">Relay event after commit</text><rect fill="#F1F1F1" height="127.5" rx="11.25" ry="11.25" style="stroke:#181818;stroke-width:0.9375;" width="403.3173" x="967.5879" y="881.25"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="328.3173" x="1005.0879" y="938.963">Consume with deduplication</text><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="328.3044" x="1005.0879" y="965.213">and ordering/version checks</text><path d="M1393.7997,1044.375 L1393.7997,1089.375 L1356.2997,1096.875 L1393.7997,1104.375 L1393.7997,1149.375 A0,0 0 0 0 1393.7997,1149.375 L1790.43,1149.375 A0,0 0 0 0 1790.43,1149.375 L1790.43,1063.125 L1771.68,1044.375 L1393.7997,1044.375 A0,0 0 0 0 1393.7997,1044.375" fill="#F3F7FA" style="stroke:#DCE5ED;stroke-width:0.9375;"/><path d="M1771.68,1044.375 L1771.68,1063.125 L1790.43,1063.125 L1771.68,1044.375" fill="#F3F7FA" style="stroke:#DCE5ED;stroke-width:0.9375;"/><text fill="#41576B" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="319.7552" x="1423.7997" y="1091.2692">Report can lag the command.</text><text fill="#41576B" font-family="Helvetica" font-size="24.375" lengthAdjust="spacing" textLength="277.7655" x="1423.7997" y="1115.6442">Delivery can be repeated.</text><rect fill="#F1F1F1" height="101.25" rx="11.25" ry="11.25" style="stroke:#181818;stroke-width:0.9375;" width="374.1064" x="982.1933" y="1046.25"/><text fill="#24374B" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="299.1064" x="1019.6933" y="1103.963">Commit projection update</text><polygon fill="#F1F1F1" points="703.0486,1168.125,725.5486,1190.625,703.0486,1213.125,680.5486,1190.625,703.0486,1168.125" style="stroke:#181818;st