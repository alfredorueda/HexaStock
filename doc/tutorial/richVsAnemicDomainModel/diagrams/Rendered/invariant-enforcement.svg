<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="935.625px" preserveAspectRatio="none" style="width:841px;height:935px;background:#FFFFFF;" version="1.1" viewBox="0 0 841 935" width="841.875px" zoomAndPan="magnify"><title>Make the accounting identity explicit</title><defs/><g><text fill="#142D4E" font-family="Helvetica" font-size="43.125" font-weight="bold" lengthAdjust="spacing" textLength="752.4344" x="37.5" y="70.7071">Make the accounting identity explicit</text><!--entity G--><g class="entity" data-entity="G" data-source-line="4" data-uid="ent0002" id="entity_G"><rect fill="#F2F7FC" height="127.5" rx="11.25" ry="11.25" width="260.2881" x="251.0624" y="133.125"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="185.2881" x="288.5624" y="190.838">Gross proceeds</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="94.8871" x="288.5624" y="217.088">1100.00</text></g><!--entity F--><g class="entity" data-entity="F" data-source-line="5" data-uid="ent0003" id="entity_F"><rect fill="#F2F7FC" height="127.5" rx="11.25" ry="11.25" width="126.0901" x="561.9187" y="326.25"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="45.2325" x="599.4187" y="383.963">Fee</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="51.0901" x="599.4187" y="410.213">1.10</text></g><!--entity N--><g class="entity" data-entity="N" data-source-line="6" data-uid="ent0004" id="entity_N"><rect fill="#E4F3EF" height="127.5" rx="11.25" ry="11.25" width="231.1285" x="265.6499" y="326.25"/><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdjust="spacing" textLength="156.1285" x="303.1499" y="383.963">Net proceeds</text><text fill="#142D4E" font-family="Helvetica" font-size="26.25" lengthAdju